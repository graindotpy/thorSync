name: Publish edge image

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - .dockerignore
      - go.mod
      - go.sum
      - assets/**
      - cmd/**
      - internal/**
      - migrations/**
      - web/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: publish-edge
  cancel-in-progress: false

jobs:
  quality-gates:
    name: Required quality gates
    uses: ./.github/workflows/quality-gates.yml

  publish:
    name: Publish linux/amd64
    runs-on: ubuntu-latest
    needs: quality-gates
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/thorsync" >> "$GITHUB_OUTPUT"
      - name: Build and publish tested image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:edge
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          build-args: |
            VERSION=edge
            REVISION=${{ github.sha }}
            CREATED=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Attest image provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
